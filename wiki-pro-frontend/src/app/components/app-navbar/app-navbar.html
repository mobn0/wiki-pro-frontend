<mat-toolbar class="navbar">
  <a class="navbar__brand" routerLink="/">WikiPro</a>

  <nav class="navbar__nav">
    <button mat-button type="button" routerLink="/">Home</button>
    @if (canManageCategories) {
      <button mat-button type="button" routerLink="/categories">Kategorien</button>
    }
  </nav>

  <span class="navbar__spacer"></span>

  @if (isLoggedIn) {
    <form class="navbar__search-form" (submit)="$event.preventDefault(); submitSearch()">
      <mat-form-field class="navbar__search" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Suche</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="search" placeholder="Suchen…" [formControl]="search" />
      </mat-form-field>
    </form>

    <button mat-button type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  }
</mat-toolbar>
