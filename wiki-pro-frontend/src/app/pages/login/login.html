<div class="center-page">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Willkommen bei WikiPro</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="muted">
        Melde dich an, um Kategorien, Themen und Artikel zu durchsuchen und zu bearbeiten.
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button type="button" (click)="signIn()">
        <mat-icon>login</mat-icon>
        Login mit Keycloak
      </button>
    </mat-card-actions>
  </mat-card>
</div>
