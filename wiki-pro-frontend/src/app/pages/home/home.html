<app-page-header title="Kategorien" />

<app-status [loading]="loading()" [error]="error()" />

@if (categories().length > 0) {
  <mat-nav-list>
    @for (category of categories(); track category.id) {
      <a mat-list-item [routerLink]="['/categories', category.id]">
        <span matListItemTitle>{{ category.name }}</span>
        <span matListItemLine>
          {{ category.topicCount }} {{ category.topicCount === 1 ? 'Thema' : 'Themen' }}
        </span>
        <mat-icon matListItemMeta>chevron_right</mat-icon>
      </a>
    }
  </mat-nav-list>
} @else if (!loading()) {
  <p class="muted">Noch keine Kategorien vorhanden.</p>
}
